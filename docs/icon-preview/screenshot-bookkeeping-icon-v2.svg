<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#31577A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Home-screen context for preview only; not part of the final launcher icon. -->
  <rect width="512" height="512" fill="#A9CEF3"/>

  <!-- Android applies the final device-specific mask to this white background. -->
  <rect x="88" y="88" width="336" height="336" rx="76" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- A single, optically centered bookkeeping mark with generous safe-area padding. -->
  <g fill="none" stroke="#F47B20" stroke-width="24" stroke-linecap="round">
    <path d="M166 188 H326"/>
    <path d="M166 244 H274"/>
    <path d="M166 300 H230"/>
    <path d="M324 270 V342"/>
    <path d="M288 306 H360"/>
  </g>
</svg>
