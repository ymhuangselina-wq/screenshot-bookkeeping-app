<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>场景选项·优化预览</title>
  <style>
    :root {
      color-scheme: light;
      --orange: #f47b20;
      --orange-weak: #fff4ec;
      --surface: #fffbfe;
      --canvas: #ece8eb;
      --ink: #282328;
      --muted: #746c73;
      --line: #e5dee3;
      --field: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: start center;
      overflow: hidden;
      background: var(--canvas);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .phone {
      position: relative;
      width: min(100%, 390px);
      height: 100vh;
      min-height: 680px;
      overflow: hidden;
      background: #fbf8fa;
      box-shadow: 0 20px 60px rgba(49, 39, 47, .16);
    }
    .underlay {
      padding: 18px 20px;
      color: #3e383e;
      opacity: .58;
    }
    .underlay strong { font-size: 23px; }
    .underlay-card {
      height: 92px;
      margin-top: 42px;
      border: 1px solid #eadfd9;
      border-radius: 16px;
      background: #fff7f2;
    }
    .scrim { position: absolute; inset: 0; background: rgba(32, 27, 31, .30); }
    .sheet {
      position: absolute;
      inset: 34px 0 0;
      display: grid;
      grid-template-rows: auto auto 1fr;
      overflow: hidden;
      border-radius: 28px 28px 0 0;
      background: var(--surface);
      box-shadow: 0 -8px 30px rgba(42, 32, 40, .12);
    }
    .sheet-head {
      padding-top: 10px;
      background: var(--surface);
    }
    .grabber {
      width: 34px;
      height: 4px;
      margin: 0 auto 8px;
      border-radius: 3px;
      background: #766e75;
    }
    .titlebar {
      height: 58px;
      display: grid;
      grid-template-columns: 80px 1fr 80px;
      align-items: center;
      padding: 0 8px;
    }
    .titlebar h1 {
      margin: 0;
      text-align: center;
      font-size: 18px;
      line-height: 24px;
      font-weight: 720;
      letter-spacing: -.01em;
    }
    .text-button {
      min-width: 48px;
      height: 44px;
      padding: 0 12px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--orange);
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
    }
    .text-button:first-child { justify-self: start; }
    .text-button:last-child { justify-self: end; }
    .text-button:hover { background: var(--orange-weak); }
    .text-button:focus-visible, .icon-button:focus-visible, .row:focus-visible, .search:focus-within {
      outline: 3px solid rgba(244, 123, 32, .20);
      outline-offset: 1px;
    }
    .tools {
      display: grid;
      grid-template-columns: 1fr 48px;
      gap: 10px;
      padding: 8px 20px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .search {
      height: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      border: 1px solid #d9d1d7;
      border-radius: 14px;
      background: var(--field);
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .search:focus-within { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(244,123,32,.08); outline: 0; }
    .search svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
    .search input {
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
    }
    .search input::placeholder { color: #9a9299; opacity: 1; }
    .icon-button {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 14px;
      background: var(--orange-weak);
      color: var(--orange);
      cursor: pointer;
    }
    .icon-button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; }
    .list {
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-color: #c9c1c7 transparent;
      scrollbar-width: thin;
      background: var(--surface);
    }
    .list::-webkit-scrollbar { width: 5px; }
    .list::-webkit-scrollbar-thumb { border-radius: 4px; background: #c9c1c7; }
    .row {
      width: 100%;
      min-height: 64px;
      display: grid;
      grid-template-columns: 42px 1fr 44px;
      align-items: center;
      gap: 8px;
      padding: 0 12px 0 20px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }
    .row:hover { background: #faf6f9; }
    .row.selected { background: var(--orange-weak); }
    .radio {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border: 2px solid #7b737a;
      border-radius: 50%;
      transition: border-color 150ms ease;
    }
    .selected .radio { border-color: var(--orange); }
    .selected .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--orange); }
    .name { min-width: 0; overflow: hidden; font-size: 16px; line-height: 23px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
    .selected .name { color: #7f3b0d; font-weight: 650; }
    .more {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .more:hover { background: #eee8ec; }
    .more svg { width: 20px; height: 20px; fill: currentColor; }
    .empty { display: none; padding: 64px 24px; color: var(--muted); text-align: center; font-size: 14px; }
    .menu {
      position: fixed;
      z-index: 3;
      width: 132px;
      padding: 6px;
      display: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(47, 37, 45, .18);
    }
    .menu.open { display: block; }
    .menu button { width: 100%; height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
    .menu button:hover { background: #f7f2f5; }
    .menu .danger { color: #ba1a1a; }
    @media (max-width: 420px) { body { display: block; } .phone { width: 100%; box-shadow: none; } }
  </style>
</head>
<body>
  <div class="phone">
    <div class="underlay"><strong>截图记账</strong><div class="underlay-card"></div></div>
    <div class="scrim"></div>
    <section class="sheet" aria-label="选择场景">
      <header class="sheet-head">
        <div class="grabber" aria-hidden="true"></div>
        <div class="titlebar">
          <button class="text-button" type="button">取消</button>
          <h1>场景</h1>
          <button class="text-button" type="button">完成</button>
        </div>
      </header>
      <div class="tools">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.2 16.2 4 4"></path></svg>
          <input id="search" type="search" placeholder="查找选项" autocomplete="off">
        </label>
        <button id="add" class="icon-button" type="button" aria-label="新建选项">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>
      <div id="list" class="list" role="radiogroup" aria-label="场景选项"></div>
    </section>
    <div id="menu" class="menu" role="menu">
      <button type="button">重命名</button>
      <button class="danger" type="button">删除</button>
    </div>
  </div>
  <script>
    const values = ["日常消费", "通勤出行", "娱乐休闲", "医疗保健", "住房", "专项兴趣", "家人", "爱人", "亲友", "结交人脉"];
    let selected = "日常消费";
    const list = document.querySelector("#list");
    const search = document.querySelector("#search");
    const menu = document.querySelector("#menu");
    const moreIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>';
    function render() {
      const query = search.value.trim().toLowerCase();
      const filtered = values.filter(v => v.toLowerCase().includes(query));
      list.innerHTML = filtered.map(value => `
        <button class="row ${value === selected ? "selected" : ""}" type="button" role="radio" aria-checked="${value === selected}" data-value="${value}">
          <span class="radio" aria-hidden="true"></span><span class="name">${value}</span>
          <span class="more" role="button" tabindex="0" aria-label="${value}的更多操作">${moreIcon}</span>
        </button>`).join("") || '<div class="empty" style="display:block">没有找到匹配的选项</div>';
    }
    list.addEventListener("click", event => {
      const more = event.target.closest(".more");
      if (more) {
        event.stopPropagation();
        const rect = more.getBoundingClientRect();
        menu.style.left = `${Math.min(rect.left - 86, innerWidth - 144)}px`;
        menu.style.top = `${Math.min(rect.bottom - 4, innerHeight - 96)}px`;
        menu.classList.add("open");
        return;
      }
      const row = event.target.closest(".row");
      if (row) { selected = row.dataset.value; render(); }
    });
    search.addEventListener("input", render);
    document.querySelector("#add").addEventListener("click", () => {
      search.value = "";
      search.placeholder = "输入新选项名称";
      search.focus();
    });
    document.addEventListener("click", event => { if (!event.target.closest(".more") && !event.target.closest(".menu")) menu.classList.remove("open"); });
    render();
  </script>
</body>
</html>
