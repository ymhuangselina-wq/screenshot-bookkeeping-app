<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>截图记账 · 主页面优化预览</title>
  <style>
    :root {
      color-scheme: light;
      --orange: #f47b20;
      --orange-soft: #fff7f2;
      --canvas: #f5f2f5;
      --surface: #fffbfe;
      --ink: #282328;
      --muted: #716971;
      --outline: #ded7dc;
      --outline-focus: #f47b20;
      --field-gap: 14px;
      --page-x: 20px;
    }

    * { box-sizing: border-box; }
    html { background: var(--canvas); }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      background: var(--canvas);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .phone {
      width: min(100%, 390px);
      min-height: 100vh;
      background: var(--surface);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(52, 42, 52, .13);
    }

    .app-bar {
      height: 68px;
      padding: 8px 12px 4px var(--page-x);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .app-bar h1 {
      margin: 0 auto 0 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -.02em;
      font-weight: 720;
    }

    .icon-button {
      width: 48px;
      height: 48px;
      padding: 12px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #504950;
      cursor: pointer;
    }
    .icon-button:hover { background: #f2edf1; }
    .icon-button:focus-visible { outline: 3px solid rgba(244, 123, 32, .28); }
    .icon-button svg { display: block; width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; }
    .icon-button[aria-label="设置"] svg {
      width: 22px;
      height: 22px;
      margin: 0 auto;
      stroke-width: 1.8;
      transform: translateY(2px);
    }

    main { padding: 14px var(--page-x) 28px; }

    .book-card {
      position: relative;
      min-height: 78px;
      padding: 14px 16px;
      border: 1px solid #eee3dd;
      border-radius: 16px;
      background: var(--orange-soft);
    }

    .book-copy { min-width: 0; }
    .book-name {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-size: 16px;
      line-height: 23px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .table-name {
      margin: 7px 0 0;
      color: #625b62;
      font-size: 14px;
      line-height: 20px;
      font-weight: 550;
    }

    .book-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .text-action {
      min-height: 40px;
      padding: 8px 7px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--orange);
      font-size: 14px;
      line-height: 20px;
      font-weight: 650;
      cursor: pointer;
      white-space: nowrap;
    }
    .text-action svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }
    .text-action:hover { background: rgba(244, 123, 32, .08); }

    .section-bar {
      margin: 22px 0 12px;
      min-height: 40px;
      display: flex;
      align-items: center;
    }
    .book-section-bar { margin: 0 0 12px; }
    .section-bar h2 {
      margin: 0 auto 0 0;
      color: #625b62;
      font-size: 14px;
      line-height: 20px;
      font-weight: 650;
    }

    .fields { display: grid; gap: var(--field-gap); }
    .field {
      position: relative;
      min-width: 0;
      height: 56px;
      margin: 0;
      padding: 0 48px 0 16px;
      border: 1px solid var(--outline);
      border-radius: 13px;
      background: #fff;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }
    .field:focus-within {
      border-color: var(--outline-focus);
      background: #fffaf7;
      box-shadow: 0 0 0 3px rgba(244, 123, 32, .10);
    }
    .field legend {
      position: absolute;
      top: -8px;
      left: 12px;
      max-width: calc(100% - 20px);
      padding: 0 5px;
      color: #6d656d;
      background: var(--surface);
      font-size: 12px;
      line-height: 16px;
      font-weight: 620;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .field input {
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 16px;
      line-height: 24px;
    }
    .field input::placeholder { color: #aaa2aa; opacity: 1; }
    .field.amount input { font-weight: 680; font-variant-numeric: tabular-nums; }

    .field-action {
      position: absolute;
      top: 50%;
      right: 10px;
      min-width: 40px;
      height: 40px;
      padding: 0 6px;
      border: 0;
      border-radius: 10px;
      transform: translateY(-50%);
      background: transparent;
      color: var(--orange);
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }
    .field-action.chevron { color: #625b62; }
    .field-action.chevron svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; }

    .primary-action {
      width: 100%;
      height: 54px;
      margin-top: 32px;
      border: 0;
      border-radius: 17px;
      background: var(--orange);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(244, 123, 32, .18);
      cursor: pointer;
    }
    .primary-action:active { transform: translateY(1px); }
    .helper {
      margin: 12px 0 0;
      color: #8b838b;
      text-align: center;
      font-size: 12px;
      line-height: 18px;
    }

    .sort-mode .fields { padding-right: 46px; }
    .sort-mode .drag-handle { display: grid; }
    .drag-handle {
      display: none;
      position: absolute;
      top: 50%;
      right: -46px;
      width: 40px;
      height: 48px;
      padding: 0;
      border: 0;
      border-radius: 12px;
      transform: translateY(-50%);
      place-items: center;
      background: transparent;
      color: #716971;
      cursor: grab;
      font-size: 19px;
      line-height: 1;
      touch-action: none;
      user-select: none;
    }
    .drag-handle:hover { background: #f2edf1; }
    .drag-handle:active { cursor: grabbing; }
    .field.dragging {
      z-index: 2;
      border-color: var(--orange);
      background: #fffaf7;
      box-shadow: 0 8px 22px rgba(52, 42, 52, .16);
    }

    @media (max-width: 420px) {
      body { display: block; }
      .phone { width: 100%; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="phone" id="screen">
    <header class="app-bar">
      <h1>截图记账</h1>
      <button class="icon-button" aria-label="新建">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-button" aria-label="刷新">
        <svg viewBox="0 0 24 24"><path d="M20 6v5h-5"/><path d="M19 11a7.5 7.5 0 1 0 .2 5"/></svg>
      </button>
      <button class="icon-button" aria-label="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/></svg>
      </button>
    </header>

    <main>
      <div class="section-bar book-section-bar">
        <h2>当前账本</h2>
        <div class="book-actions">
          <button class="text-action">⇅ 切换</button>
        </div>
      </div>

      <section class="book-card">
        <div class="book-copy">
          <p class="book-name">个人财务报表（2026年）</p>
          <p class="table-name">资产</p>
        </div>
      </section>

      <div class="section-bar">
        <h2 id="sectionTitle">记账字段</h2>
        <button class="text-action" id="sortButton">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          <span>排序</span>
        </button>
      </div>

      <section class="fields" aria-label="记账字段">
        <fieldset class="field"><legend>名称</legend><input value="招商银行存款" aria-label="名称"/><button class="drag-handle" type="button" aria-label="拖动名称字段">⋮⋮</button></fieldset>
        <fieldset class="field"><legend>资管平台</legend><input value="招商银行" readonly aria-label="资管平台"/><button class="field-action chevron" aria-label="选择资管平台"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><button class="drag-handle" type="button" aria-label="拖动资管平台字段">⋮⋮</button></fieldset>
        <fieldset class="field"><legend>持有账户（用途）</legend><input value="日常储蓄" readonly aria-label="持有账户"/><button class="field-action chevron" aria-label="选择持有账户"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><button class="drag-handle" type="button" aria-label="拖动持有账户字段">⋮⋮</button></fieldset>
        <fieldset class="field"><legend>货币类型</legend><input value="人民币" readonly aria-label="货币类型"/><button class="field-action chevron" aria-label="选择货币类型"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><button class="drag-handle" type="button" aria-label="拖动货币类型字段">⋮⋮</button></fieldset>
        <fieldset class="field amount"><legend>资产金额</legend><input value="¥ 50,000.00" inputmode="decimal" aria-label="资产金额"/><button class="drag-handle" type="button" aria-label="拖动资产金额字段">⋮⋮</button></fieldset>
        <fieldset class="field"><legend>备注</legend><input placeholder="选填" aria-label="备注"/><button class="drag-handle" type="button" aria-label="拖动备注字段">⋮⋮</button></fieldset>
        <fieldset class="field"><legend>记录日期</legend><input value="2026-09-25 15:22:32" readonly aria-label="记录日期"/><button class="field-action">选择</button><button class="drag-handle" type="button" aria-label="拖动记录日期字段">⋮⋮</button></fieldset>
      </section>

      <button class="primary-action">记录到当前账本</button>
      <p class="helper">字段名称和格式来自飞书</p>
    </main>
  </div>

  <script>
    const screen = document.querySelector('#screen');
    const fields = document.querySelector('.fields');
    const sortButton = document.querySelector('#sortButton');
    const sortButtonLabel = sortButton.querySelector('span');
    const sectionTitle = document.querySelector('#sectionTitle');
    sortButton.addEventListener('click', () => {
      const active = screen.classList.toggle('sort-mode');
      sortButtonLabel.textContent = active ? '完成' : '排序';
      sectionTitle.textContent = active ? '调整字段顺序' : '记账字段';
    });

    let draggedField = null;
    fields.querySelectorAll('.drag-handle').forEach((handle) => {
      handle.addEventListener('pointerdown', (event) => {
        if (!screen.classList.contains('sort-mode')) return;
        event.preventDefault();
        draggedField = handle.closest('.field');
        draggedField.classList.add('dragging');
      });
    });

    document.addEventListener('pointermove', (event) => {
      if (!draggedField) return;
      event.preventDefault();
      const candidates = [...fields.querySelectorAll('.field:not(.dragging)')];
      const next = candidates.find((item) => {
        const rect = item.getBoundingClientRect();
        return event.clientY < rect.top + rect.height / 2;
      });
      fields.insertBefore(draggedField, next || null);
    }, { passive: false });

    const finishDrag = () => {
      if (!draggedField) return;
      draggedField.classList.remove('dragging');
      draggedField = null;
    };
    document.addEventListener('pointerup', finishDrag);
    document.addEventListener('pointercancel', finishDrag);
  </script>
</body>
</html>
